<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#090A0D" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>

    <!-- Warm Studio Prism Gradient -->
    <linearGradient id="prismGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="45%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Subtle Card Surface Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161921" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0E1015" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#222631" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Surface -->
  <rect width="1280" height="640" fill="#090A0D"/>
  <rect width="1280" height="640" fill="url(#bgGlow)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <!-- Ambient Flare behind Emblem -->
  <circle cx="640" cy="180" r="160" fill="url(#prismGrad)" opacity="0.14" filter="url(#softGlow)"/>

  <!-- Hero Emblem (Centered 120x120 scale) -->
  <g transform="translate(580, 100) scale(1.875)">
    <rect width="64" height="64" rx="14" fill="#0E1015" stroke="#2A2F3D" stroke-width="1.8"/>
    <!-- Outer Acoustic Wave Rings -->
    <path d="M10 26 A22 22 0 0 1 54 26" fill="none" stroke="url(#prismGrad)" stroke-width="2.2" stroke-linecap="round" opacity="0.45"/>
    <path d="M6 26 A26 26 0 0 1 58 26" fill="none" stroke="url(#prismGrad)" stroke-width="1.6" stroke-linecap="round" opacity="0.25"/>
    <!-- Bulb Glass Envelope -->
    <path d="M22 36 C17 31 17 20 24 15 C29 11 35 11 40 15 C47 20 47 31 42 36 C39 39 38 42 38 45 L26 45 C26 42 25 39 22 36 Z"
          fill="url(#prismGrad)" fill-opacity="0.18" stroke="url(#prismGrad)" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Internal Equalizer Filament -->
    <line x1="27" y1="31" x2="27" y2="23" stroke="#F8FAFC" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="32" y1="34" x2="32" y2="18" stroke="#F59E0B" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="37" y1="31" x2="37" y2="25" stroke="#F8FAFC" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Screw Base -->
    <line x1="27" y1="50" x2="37" y2="50" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="29" y1="54" x2="35" y2="54" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Typography: Product Wordmark -->
  <text x="640" y="310" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="54" font-weight="900" letter-spacing="-1.5" fill="#F8FAFC">
    IOT-Bulb <tspan fill="url(#prismGrad)">Sync</tspan>
  </text>

  <!-- Subtitle -->
  <text x="640" y="358" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-size="18" font-weight="600" letter-spacing="0.5" fill="#94A3B8">
    100% Local LAN • &lt;15ms Rust DSP • YouTube Ambient • IMAX Screen Sync • Tuya DP 27
  </text>

  <!-- 3 Miniature Architectural Badges -->
  <g transform="translate(185, 420)">
    <!-- Badge 1: Audio Stem Isolation -->
    <g transform="translate(0, 0)">
      <rect width="270" height="76" rx="12" fill="url(#cardGrad)" stroke="#222631" stroke-width="1.2"/>
      <circle cx="36" cy="38" r="16" fill="#F59E0B" fill-opacity="0.14"/>
      <!-- Audio wave icon -->
      <path d="M28 38 L31 32 L34 44 L37 34 L40 42 L43 38" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="66" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#F3F4F6">Audio Stem Isolation</text>
      <text x="66" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500" fill="#64748B">Mid/Side Split • Biquad Filter</text>
    </g>

    <!-- Badge 2: YouTube Frame Oklab Engine -->
    <g transform="translate(320, 0)">
      <rect width="270" height="76" rx="12" fill="url(#cardGrad)" stroke="#222631" stroke-width="1.2"/>
      <circle cx="36" cy="38" r="16" fill="#F43F5E" fill-opacity="0.14"/>
      <!-- Prism / Frame icon -->
      <polygon points="36,26 47,45 25,45" fill="none" stroke="#F43F5E" stroke-width="2" stroke-linejoin="round"/>
      <text x="66" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#F3F4F6">YouTube Frame Engine</text>
      <text x="66" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500" fill="#64748B">Oklab Perceptual • Zero-Lag 30fps</text>
    </g>

    <!-- Badge 3: Zero-Cloud Port 6668 -->
    <g transform="translate(640, 0)">
      <rect width="270" height="76" rx="12" fill="url(#cardGrad)" stroke="#222631" stroke-width="1.2"/>
      <circle cx="36" cy="38" r="16" fill="#6366F1" fill-opacity="0.14"/>
      <!-- Shield / LAN icon -->
      <path d="M36 28 L44 32 V38 C44 43 36 47 36 47 C36 47 28 43 28 38 V32 Z" fill="none" stroke="#6366F1" stroke-width="2" stroke-linejoin="round"/>
      <text x="66" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#F3F4F6">Zero-Cloud Port 6668</text>
      <text x="66" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500" fill="#64748B">100% Local LAN • Hardware DP 27</text>
    </g>
  </g>

  <!-- Bottom Hardware Status Line -->
  <line x1="200" y1="560" x2="1080" y2="560" stroke="#1E222D" stroke-width="1"/>
  <text x="640" y="588" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="11" font-weight="600" fill="#475569" letter-spacing="1.2">
    TEENAGE ENGINEERING / PRO STUDIO AESTHETIC • ULTRA-LOW JITTER DSP &bull; ZERO TELEMETRY TRACKING
  </text>
</svg>
