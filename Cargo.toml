[workspace]
resolver = "2"
members = [
    "crates/rustuya-core",
    "crates/rustuya-tokio",
    "crates/rustuya",
    "crates/tuya-bulb",
    "crates/beat-sync",
    "crates/backend",
]

[workspace.package]
version = "0.4.6"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/3735943886/rustuya"
readme = "README.md"

[workspace.dependencies]
rustuya-core = { path = "crates/rustuya-core", version = "0.4.6" }
rustuya-tokio = { path = "crates/rustuya-tokio", version = "0.4.6" }
rustuya = { path = "crates/rustuya", version = "0.4.6", features = ["tokio"] }
tuya-bulb = { path = "crates/tuya-bulb" }
beat-sync = { path = "crates/beat-sync" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
thiserror = "2.0"
